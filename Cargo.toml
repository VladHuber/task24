[package]
name = "task24"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "macros"
] }
chrono = { version = "0.4", features = ["serde"] }

dotenvy = "0.15"
serde_json = "1.0.151"
argon2 = "0.6.0"
jsonwebtoken = "9.3"